<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smith Online mockup</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --border: #d9dde3; --text: #1b1f24; --muted: #5f6b7a;
    --accent: #0b6bcb; --accent-soft: #e3f0fd; --grid-z: #8fa3b8; --grid-y: #d7b9a3;
    --path: #d6336c; --marker: #1b1f24; --vswr: #2f9e44; --q: #f08c00; --stab: #7048e8;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0f1419; --panel: #161c24; --border: #2a3340; --text: #e6edf3; --muted: #9aa7b5;
    --accent: #4da3ff; --accent-soft: #15283d; --grid-z: #4b5d70; --grid-y: #6e5a4c; --marker: #e6edf3;
  } }
  :root[data-theme="dark"] {
    --bg: #0f1419; --panel: #161c24; --border: #2a3340; --text: #e6edf3; --muted: #9aa7b5;
    --accent: #4da3ff; --accent-soft: #15283d; --grid-z: #4b5d70; --grid-y: #6e5a4c; --marker: #e6edf3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 13px/1.4 var(--font); display: grid;
    grid-template-rows: 48px 1fr 28px; grid-template-columns: 290px 1fr 320px;
    grid-template-areas: "top top top" "left chart right" "status status status"; height: 100vh; }
  header { grid-area: top; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header .brand { font-weight: 700; font-size: 15px; margin-right: 8px; }
  header .tabs { display: flex; gap: 2px; background: var(--bg); border-radius: 8px; padding: 2px; }
  header .tabs button { border: 0; background: transparent; color: var(--muted); padding: 5px 12px; border-radius: 6px; font: inherit; cursor: pointer; }
  header .tabs button.on { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  header .field { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  header input { width: 92px; font: inherit; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
  header .spacer { flex: 1; }
  .btn { border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 5px 10px; border-radius: 6px; font: inherit; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  aside { background: var(--panel); border-right: 1px solid var(--border); overflow: auto; padding: 12px; }
  aside.right { grid-area: right; border-right: 0; border-left: 1px solid var(--border); }
  aside.left { grid-area: left; }
  h2 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 8px; }
  h2:first-child { margin-top: 0; }
  .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .palette button { aspect-ratio: 1; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text); font: 10px var(--font); }
  .palette button:hover { border-color: var(--accent); background: var(--accent-soft); }
  .palette svg { width: 30px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  .ladder { display: flex; flex-direction: column; gap: 6px; }
  .el { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--bg); }
  .el .row { display: flex; align-items: center; gap: 8px; }
  .el .idx { width: 20px; height: 20px; border-radius: 50%; background: var(--path); color: #fff; font-size: 10px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
  .el .name { flex: 1; font-weight: 600; }
  .el .val { font-family: var(--mono); background: var(--panel); border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; }
  .el input[type=range] { width: 100%; margin: 6px 0 0; accent-color: var(--accent); }
  .el.load { border-style: dashed; }
  main { grid-area: chart; position: relative; display: flex; align-items: center; justify-content: center; padding: 10px; }
  main svg { width: 100%; height: 100%; max-height: calc(100vh - 100px); }
  .toolbar { position: absolute; top: 16px; left: 16px; display: flex; gap: 6px; }
  .toolbar .btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11.5px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-family: var(--font); padding: 3px 4px; border-bottom: 1px solid var(--border); }
  td { padding: 3px 4px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tr.sel td { background: var(--accent-soft); }
  .circles label { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); }
  .circles .sw { width: 10px; height: 10px; border-radius: 2px; }
  .circles input { accent-color: var(--accent); }
  .circles .meta { margin-left: auto; color: var(--muted); font-family: var(--mono); font-size: 11px; }
  footer { grid-area: status; background: var(--panel); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 18px; padding: 0 14px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  @media (max-width: 1000px) { body { grid-template-columns: 1fr; grid-template-rows: 48px 1fr auto 28px; grid-template-areas: "top" "chart" "left" "status"; } aside.right { display: none; } }
</style>
</head>
<body>
<header>
  <span class="brand">Smith Online</span>
  <div class="tabs"><button class="on">Smith chart</button><button>S-Plot</button></div>
  <span class="field">Design <input value="Example 5"></span>
  <span class="field">f <input value="450 MHz"></span>
  <span class="field">Z0 <input value="50 Ω"></span>
  <span class="spacer"></span>
  <button class="btn" title="Undo">↶</button><button class="btn" title="Redo">↷</button>
  <button class="btn">Open</button><button class="btn">Save</button><button class="btn">Export ▾</button>
  <button class="btn primary">Share link</button>
</header>

<aside class="left">
  <h2>Add element</h2>
  <div class="palette" id="palette"></div>
  <h2>Network (load to source)</h2>
  <div class="ladder" id="ladder"></div>
</aside>

<main>
  <div class="toolbar">
    <button class="btn on">Z grid</button><button class="btn on">Y grid</button><button class="btn">Fine</button><button class="btn">Fit</button>
  </div>
  <svg id="chart" viewBox="-1.15 -1.15 2.3 2.3" xmlns="http://www.w3.org/2000/svg"></svg>
</main>

<aside class="right">
  <h2>Datapoints @ 450 MHz</h2>
  <table id="dps"><thead><tr><th>#</th><th>Z (Ω)</th><th>|Γ|</th><th>∠Γ</th><th>VSWR</th><th>RL</th></tr></thead><tbody></tbody></table>
  <h2>Circles and contours</h2>
  <div class="circles">
    <label><input type="checkbox" checked><span class="sw" style="background:var(--q)"></span>Q contour<span class="meta">Q = 0.6</span></label>
    <label><input type="checkbox" checked><span class="sw" style="background:var(--vswr)"></span>VSWR circle<span class="meta">1.5</span></label>
    <label><input type="checkbox"><span class="sw" style="background:var(--stab)"></span>Stability in / out<span class="meta">needs S-params</span></label>
    <label><input type="checkbox"><span class="sw" style="background:#868e96"></span>Noise figure<span class="meta">needs noise params</span></label>
    <label><input type="checkbox"><span class="sw" style="background:#868e96"></span>Gain (Gp, Ga, Gu)<span class="meta">needs S-params</span></label>
  </div>
  <h2>Selected datapoint</h2>
  <table><tbody>
    <tr><td>Z</td><td id="selZ"></td></tr><tr><td>Y</td><td id="selY"></td></tr><tr><td>z (norm.)</td><td id="selz"></td></tr><tr><td>Γ</td><td id="selG"></td></tr><tr><td>Q</td><td id="selQ"></td></tr>
  </tbody></table>
</aside>

<footer>
  <span id="cursor">cursor: z = 1.000 + j0.000  y = 1.000 - j0.000  Γ = 0.000 ∠ 0.0°</span>
  <span>demo data: Example 5 from Smith V4.1</span>
</footer>

<script>
// Minimal complex math and element evaluation. Same formulas the real core library will use.
const C = (re, im) => ({ re, im });
const add = (a, b) => C(a.re + b.re, a.im + b.im);
const mul = (a, b) => C(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
const inv = (a) => { const d = a.re * a.re + a.im * a.im; return C(a.re / d, -a.im / d); };
const abs = (a) => Math.hypot(a.re, a.im);
const Z0 = 50, F = 450e6, w = 2 * Math.PI * F;

// Example 5 from the original: load 20 - j12, then shunt L, series C, shunt L, series C, shunt L.
const load = C(20, -12);
const elements = [
  { typ: 5, name: 'Shunt L', value: 16.0334e-9, unit: 'nH', scale: 1e9 },
  { typ: 2, name: 'Series C', value: 21.8355e-12, unit: 'pF', scale: 1e12 },
  { typ: 5, name: 'Shunt L', value: 21.8834e-9, unit: 'nH', scale: 1e9 },
  { typ: 2, name: 'Series C', value: 16e-12, unit: 'pF', scale: 1e12 },
  { typ: 5, name: 'Shunt L', value: 29.5e-9, unit: 'nH', scale: 1e9 },
];
function apply(z, el) {
  switch (el.typ) {
    case 2: return add(z, C(0, -1 / (w * el.value)));            // series C
    case 4: return add(z, C(0, w * el.value));                   // series L
    case 3: return inv(add(inv(z), C(0, w * el.value)));         // shunt C
    case 5: return inv(add(inv(z), C(0, -1 / (w * el.value))));  // shunt L
  }
  return z;
}
function gamma(z) { return mul(add(z, C(-Z0, 0)), inv(add(z, C(Z0, 0)))); }

// Chart
const svg = document.getElementById('chart');
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent = svg) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
const clip = el('clipPath', { id: 'unit' }); el('circle', { cx: 0, cy: 0, r: 1 }, clip);
el('circle', { cx: 0, cy: 0, r: 1, fill: 'var(--panel)', stroke: 'var(--text)', 'stroke-width': 0.006 });
const gY = el('g', { 'clip-path': 'url(#unit)', stroke: 'var(--grid-y)', fill: 'none', 'stroke-width': 0.0025, opacity: 0.55 });
const gZ = el('g', { 'clip-path': 'url(#unit)', stroke: 'var(--grid-z)', fill: 'none', 'stroke-width': 0.003 });
const rVals = [0.2, 0.5, 1, 2, 5], xVals = [0.2, 0.5, 1, 2, 5];
function grid(g, sign) {
  for (const r of rVals) el('circle', { cx: sign * r / (1 + r), cy: 0, r: 1 / (1 + r) }, g);
  for (const x of xVals) for (const s of [1, -1]) el('circle', { cx: sign * 1, cy: -s / x, r: 1 / x }, g);
  el('line', { x1: -1, y1: 0, x2: 1, y2: 0 }, g);
}
grid(gY, -1); grid(gZ, 1);
// Labels on the Z grid
for (const r of rVals) { const g = gamma(C(r * Z0, 0)); const t = el('text', { x: g.re, y: -0.015, 'font-size': 0.045, fill: 'var(--muted)', 'text-anchor': 'middle', 'font-family': 'var(--font)' }); t.textContent = r; }
for (const x of [0.5, 1, 2]) for (const s of [1, -1]) { const g = gamma(C(0, s * x * Z0)); const t = el('text', { x: g.re * 1.07, y: -g.im * 1.07 + 0.015, 'font-size': 0.045, fill: 'var(--muted)', 'text-anchor': 'middle', 'font-family': 'var(--font)' }); t.textContent = (s > 0 ? '+j' : '-j') + x; }

// VSWR 1.5 circle and Q = 0.6 contour
el('circle', { cx: 0, cy: 0, r: 0.2, fill: 'none', stroke: 'var(--vswr)', 'stroke-width': 0.006, 'stroke-dasharray': '0.02 0.012' });
for (const s of [1, -1]) { const q = 0.6; el('circle', { cx: 0, cy: -s / q, r: Math.sqrt(1 + 1 / (q * q)), fill: 'none', stroke: 'var(--q)', 'stroke-width': 0.005, 'clip-path': 'url(#unit)', 'stroke-dasharray': '0.03 0.015' }); }

// Evaluate the ladder, draw the locus along constant-r or constant-g arcs
const pts = [load]; for (const e of elements) pts.push(apply(pts[pts.length - 1], e));
const gP = el('g', { fill: 'none', stroke: 'var(--path)', 'stroke-width': 0.012, 'stroke-linecap': 'round' });
for (let i = 0; i < elements.length; i++) {
  const e = elements[i]; let d = '';
  for (let k = 0; k <= 40; k++) { const t = k / 40;
    // interpolate the element from "no effect" to full value along its natural arc
    let z;
    if (e.typ === 2) z = add(pts[i], C(0, -t / (w * e.value)));
    else if (e.typ === 4) z = add(pts[i], C(0, t * w * e.value));
    else if (e.typ === 3) z = inv(add(inv(pts[i]), C(0, t * w * e.value)));
    else z = inv(add(inv(pts[i]), C(0, -t / (w * e.value))));
    const g = gamma(z); d += (k ? 'L' : 'M') + g.re.toFixed(5) + ' ' + (-g.im).toFixed(5) + ' ';
  }
  el('path', { d }, gP);
}
const tb = document.querySelector('#dps tbody');
pts.forEach((z, i) => {
  const g = gamma(z), m = abs(g), vswr = (1 + m) / (1 - m), rl = -20 * Math.log10(m);
  el('circle', { cx: g.re, cy: -g.im, r: 0.028, fill: i === pts.length - 1 ? 'var(--accent)' : 'var(--marker)', stroke: 'var(--panel)', 'stroke-width': 0.008 });
  const t = el('text', { x: g.re + 0.04, y: -g.im - 0.035, 'font-size': 0.05, 'font-weight': 700, fill: 'var(--text)', 'font-family': 'var(--font)' }); t.textContent = i === 0 ? 'DP1' : 'TP' + (i + 1);
  const tr = document.createElement('tr'); if (i === pts.length - 1) tr.className = 'sel';
  tr.innerHTML = `<td>${i}</td><td>${z.re.toFixed(2)} ${z.im < 0 ? '-' : '+'} j${Math.abs(z.im).toFixed(2)}</td><td>${m.toFixed(3)}</td><td>${(Math.atan2(g.im, g.re) * 180 / Math.PI).toFixed(1)}°</td><td>${vswr.toFixed(3)}</td><td>${isFinite(rl) ? rl.toFixed(1) + ' dB' : '∞'}</td>`;
  tb.appendChild(tr);
});
const last = pts[pts.length - 1], y = inv(last), gl = gamma(last);
document.getElementById('selZ').textContent = `${last.re.toFixed(3)} ${last.im < 0 ? '-' : '+'} j${Math.abs(last.im).toFixed(3)} Ω`;
document.getElementById('selY').textContent = `${(y.re * 1e3).toFixed(3)} ${y.im < 0 ? '-' : '+'} j${Math.abs(y.im * 1e3).toFixed(3)} mS`;
document.getElementById('selz').textContent = `${(last.re / Z0).toFixed(4)} ${last.im < 0 ? '-' : '+'} j${Math.abs(last.im / Z0).toFixed(4)}`;
document.getElementById('selG').textContent = `${abs(gl).toFixed(4)} ∠ ${(Math.atan2(gl.im, gl.re) * 180 / Math.PI).toFixed(2)}°`;
document.getElementById('selQ').textContent = (Math.abs(last.im) / last.re).toFixed(4);

// Left panel: palette and ladder
const icons = {
  'Series L': '<path d="M1 10h4a3 3 0 0 1 6 0a3 3 0 0 1 6 0a3 3 0 0 1 6 0h6"/>',
  'Series C': '<path d="M1 10h11M18 10h11M12 3v14M18 3v14"/>',
  'Series R': '<path d="M1 10h5l2-5 4 10 4-10 4 10 2-5h8"/>',
  'Shunt L': '<path d="M1 4h28M15 4v3a2.5 2.5 0 0 0 0 5a2.5 2.5 0 0 0 0 5"/>',
  'Shunt C': '<path d="M1 4h28M15 4v5M9 9h12M9 13h12M15 13v4"/>',
  'Shunt R': '<path d="M1 4h28M15 4v2l-3 2 6 3-6 3 6 3-3 2"/>',
  'Ser RLC': '<path d="M1 10h3l1-3 2 6 2-6 1 3h2a2 2 0 0 1 4 0a2 2 0 0 1 4 0h1M22 10h2M26 10h3M24 5v10M26 5v10"/>',
  'Par RLC': '<path d="M1 4h28M8 4v12M15 4v12M22 4v12M6 16h18"/>',
  'Line': '<rect x="3" y="5" width="24" height="10" rx="1"/><path d="M1 10h2M27 10h2"/>',
  'Open stub': '<path d="M1 4h28M15 4v3"/><rect x="11" y="7" width="8" height="10" rx="1"/>',
  'Short stub': '<path d="M1 4h28M15 4v3M9 17h12"/><rect x="11" y="7" width="8" height="10" rx="1"/>',
  'Xfmr': '<path d="M1 4v12M29 4v12M10 5a2 2 0 0 1 0 4a2 2 0 0 1 0 4M20 5a2 2 0 0 0 0 4a2 2 0 0 0 0 4M14 4v12M16 4v12"/>',
};
const pal = document.getElementById('palette');
for (const [name, ic] of Object.entries(icons)) { const b = document.createElement('button'); b.innerHTML = `<svg viewBox="0 0 30 20">${ic}</svg>${name}`; pal.appendChild(b); }
const lad = document.getElementById('ladder');
lad.innerHTML = `<div class="el load"><div class="row"><span class="idx">0</span><span class="name">Load</span><span class="val">20 - j12 Ω</span></div></div>` +
  elements.map((e, i) => `<div class="el"><div class="row"><span class="idx">${i + 1}</span><span class="name">${e.name}</span><span class="val">${(e.value * e.scale).toFixed(2)} ${e.unit}</span><button class="btn" style="padding:1px 6px">×</button></div><input type="range" min="0" max="100" value="50" title="Tuning cockpit"></div>`).join('');
</script>
</body>
</html>
